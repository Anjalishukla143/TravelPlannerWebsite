<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Travel Planner</title>

<link rel="stylesheet" href="css/planner.css">

</head>

<body>

<!-- Background Video -->

<video class="background-video" autoplay muted loop playsinline>
    <source src="../videos/planner-background.mp4" type="video/mp4">
</video>

<!-- Flying Planes -->

<div class="plane plane1">✈</div>
<div class="plane plane2">✈</div>
<div class="plane plane3">✈</div>

<!-- Overlay -->

<div class="overlay"></div>

<!-- Planner Card -->

<div class="planner-container">

<div class="planner-card">

<h1>AI Travel Planner</h1>

<p class="subtitle">
Plan your perfect journey across India
</p>

<form id="plannerForm">

<input
type="text"
id="destination"
placeholder="Destination"
required>

<input
type="number"
id="days"
placeholder="Number of Days"
required>

<select id="budget">

<option value="">Budget</option>

<option value="Lower">Lower</option>

<option value="Moderate">Moderate</option>

<option value="Luxury">Luxury</option>

</select>

<select id="travelMode">

<option value="">Travel Mode</option>

<option value="Flight">Flight</option>

<option value="Train">Train</option>

<option value="Car">Car</option>

<option value="Bike">Bike</option>

</select>

<select id="travelType">

<option value="">Travel Type</option>

<option value="Solo">Solo</option>

<option value="Friends">Friends</option>

<option value="Family">Family</option>

</select>

<div id="friendsCountDiv">

<select id="friendsCount">

<option value="">Friends Count</option>

<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>

</select>

</div>

<div id="familyCountDiv">

<select id="familyCount">

<option value="">Family Members</option>

<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>

</select>

</div>

<select id="food">

<option value="">Food Preference</option>

<option value="Veg">Veg</option>

<option value="Non-Veg">Non Veg</option>

<option value="Both">Both</option>

</select>

<button id="generateTripBtn">

Generate AI Trip

</button>

</form>

</div>

</div>

<script src="data/places.js"></script>

<script src="js/planner.js"></script>

</body>

</html>
