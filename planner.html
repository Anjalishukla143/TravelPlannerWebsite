<!DOCTYPE html>
<html>

<head>

    <title>Plan Your Trip</title>

    <link rel="stylesheet" href="css/planner.css">

</head>

<body>

<!-- Background Video -->

<video autoplay muted loop class="background-video">

    <source src="videos/planner-background.mp4" type="video/mp4">

</video>

<div class="overlay"></div>

<div class="planner-container">

<h1>Plan Your Trip</h1>

<form id="plannerForm">

<input
type="text"
id="destination"
placeholder="Enter Destination"
>

<input
type="number"
id="days"
placeholder="Number of Days"
>

<input
type="number"
id="budget"
placeholder="Budget (₹)"
>

<select id="travelMode">

<option value="">Select Travel Mode</option>

<option value="Flight">Flight</option>

<option value="Train">Train</option>

<option value="Car">Car</option>

<option value="Bike">Bike</option>

</select>

<!-- Travel Type -->

<select id="travelType">

<option value="">Select Travel Type</option>

<option value="Solo">Solo</option>

<option value="Friends">Friends</option>

<option value="Family">Family</option>

</select>

<!-- Friends Count -->

<div id="friendsCountDiv" style="display:none;">

<label>Number of Friends</label>

<select id="friendsCount">

<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>

</select>

</div>

<!-- Family Count -->

<div id="familyCountDiv" style="display:none;">

<label>Number of Family Members</label>

<select id="familyCount">

<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>

</select>

</div>

<select id="food">

<option value="">Food Preference</option>

<option value="Veg">Veg</option>

<option value="Non-Veg">Non-Veg</option>

<option value="Both">Both</option>

</select>

<button type="submit">

Generate Plan

</button>

</form>

</div>

<script src="data/places.js"></script>
<script src="js/planner.js"></script>

</body>

</html>
